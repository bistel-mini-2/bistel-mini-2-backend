services:
  - type: web
    name: dodam-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: render-free
      - key: APP_NAME
        value: policy-rag-backend
      - key: PSYCOPG_DATABASE_URL
        fromDatabase:
          name: dodam-postgres
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "20160"

databases:
  - name: dodam-postgres
    plan: free
    databaseName: dodam
    user: dodam
