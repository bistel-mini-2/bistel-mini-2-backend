name: Live Quality Gate

on:
  workflow_dispatch:
    inputs:
      confirm_live_cost:
        description: "RUN_LIVE_AI 입력 시에만 OpenAI/DB live smoke를 실행합니다."
        required: true
        default: "NOT_VERIFIED"
        type: choice
        options:
          - NOT_VERIFIED
          - RUN_LIVE_AI
      live_scenario_ids:
        description: "tests/eval/live_eval.py 시나리오 ID 목록"
        required: true
        default: "M01 M06 M11"
      retrieval_case_ids:
        description: "retrieval smoke case ID 목록"
        required: true
        default: "R001 R006 R011"
      runs:
        description: "live scenario별 반복 횟수"
        required: true
        default: "1"
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: live-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-smoke:
    name: Manual or scheduled live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PSYCOPG_DATABASE_URL: ${{ secrets.PSYCOPG_DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "20160"
      APP_ENV: "ci-live"
      APP_NAME: "policy-rag-backend"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifact directory
        run: mkdir -p output/live-quality-gate

      - name: Decide whether live gate is verified
        id: preflight
        run: |
          set -eu
          should_run="false"
          reason="not verified"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.confirm_live_cost }}" = "RUN_LIVE_AI" ]; then
              should_run="true"
            else
              reason="manual run did not confirm live AI cost"
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ vars.DODAM_ENABLE_SCHEDULED_LIVE_GATE }}" = "true" ]; then
              should_run="true"
            else
              reason="scheduled live gate disabled by DODAM_ENABLE_SCHEDULED_LIVE_GATE"
            fi
          fi

          if [ "$should_run" = "true" ]; then
            if [ -z "${OPENAI_API_KEY:-}" ]; then
              should_run="false"
              reason="OPENAI_API_KEY secret is not configured"
            elif [ -z "${PSYCOPG_DATABASE_URL:-}" ]; then
              should_run="false"
              reason="PSYCOPG_DATABASE_URL secret is not configured"
            fi
          fi

          {
            echo "should_run=$should_run"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          {
            echo "# Live Quality Gate"
            echo
            echo "- status: $([ "$should_run" = "true" ] && echo verified || echo not_verified)"
            echo "- reason: $reason"
            echo "- event: ${{ github.event_name }}"
            echo "- live scenario ids: ${{ inputs.live_scenario_ids || 'M01 M06 M11' }}"
            echo "- retrieval case ids: ${{ inputs.retrieval_case_ids || 'R001 R006 R011' }}"
            echo "- runs: ${{ inputs.runs || '1' }}"
          } > output/live-quality-gate/preflight.md

      - name: Set up Python
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.preflight.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Run retrieval smoke
        if: steps.preflight.outputs.should_run == 'true'
        env:
          PYTHONPATH: "."
          RETRIEVAL_CASE_IDS: ${{ inputs.retrieval_case_ids || 'R001 R006 R011' }}
        run: |
          python tests/eval/retrieval_eval.py \
            --ids $RETRIEVAL_CASE_IDS \
            --top-k 5 \
            --strategies adaptive \
            --case-timeout-seconds 30 \
            --output output/live-quality-gate/retrieval-smoke.json

      - name: Run selected live AI scenarios
        if: steps.preflight.outputs.should_run == 'true'
        env:
          PYTHONPATH: "."
          LIVE_SCENARIO_IDS: ${{ inputs.live_scenario_ids || 'M01 M06 M11' }}
          LIVE_RUNS: ${{ inputs.runs || '1' }}
        run: |
          python tests/eval/live_eval.py --ids $LIVE_SCENARIO_IDS --runs "$LIVE_RUNS"
          mv tests/eval/live_eval_results.json output/live-quality-gate/live-eval-results.json

      - name: Upload live gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-quality-gate-${{ github.run_id }}
          path: output/live-quality-gate/
          retention-days: 14
